[metadata]
name = pionix_control
version = attr: pionix_control.__version__
description= A control module
long_description = file: README.md
long_description_content_type= text/markdown
url= https://github.com/PionixInternal/pionix-control
author = Kai-Uwe Hermann
author_email = kai-uwe.hermann@pionix.de
classifiers =
    Development Status :: 3 - Alpha
    Intended Audience :: Developers
    License :: OSI Approved :: Apache Software License

[options]
packages = pionix_control
package_dir =
    = src
python_requires = >=3.6
install_requires =
    Jinja2>=2.11
    PyYAML>=5.3
    requests>=2
    paho-mqtt>=1.6.1,<3
    dbus-python>=1.3.2
    python-dotenv>=1.0.0

[options.entry_points]
console_scripts =
    pionix-control = pionix_control:main

[pycodestyle]
max-line-length = 120
